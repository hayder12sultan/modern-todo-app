<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow - Modern To-Do App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>TaskFlow</h1>
        <p>stay organized, stay productive</p>
      </div>

      <!-- Input Section -->
      <div class="input-section">
        <div class="input-group">
          <input
            type="text"
            id="taskInput"
            placeholder="What needs to be done?"
          />
          <button id="addBtn">Add Task</button>
        </div>
      </div>

      <!-- Filter Tabs -->
      <div class="tabs">
        <button class="tab active" data-filter="all">All</button>
        <button class="tab" data-filter="active">Active</button>
        <button class="tab" data-filter="completed">Completed</button>
        <button class="tab" data-filter="history">History</button>
      </div>

      <div class="tasks-container" id="tasksContainer">
        <!-- Tasks will appear here -->
      </div>
    </div>
    <div id="editModal" class="modal">
      <div class="modal-content">
        <h3>Edit Task</h3>
        <input type="text" id="editInput" placeholder="Update your task..." />
        <div class="modal-buttons">
          <button id="closeModalBtn" class="modal-btn modal-btn-cancel">
            Cancel
          </button>
          <button id="saveEditBtn" class="modal-btn modal-btn-save">
            Save
          </button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>

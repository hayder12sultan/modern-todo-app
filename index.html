<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern-Todo-App</title>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <h1>tasks</h1>
        <p>stay focused, stay organized</p>
      </div>

      <div class="input-card">
        <div class="input-group">
          <div class="input-wrapper">
            <input
              type="text"
              id="taskInput"
              placeholder="Add a new task..."
              autocomplete="off"
            />
          </div>
          <button class="add-btn" id="addBtn">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M12 4v16M4 12h16" />
            </svg>
          </button>
        </div>
      </div>

      <div class="tabs-container">
        <button class="tab active" data-filter="all">all</button>
        <button class="tab" data-filter="active">active</button>
        <button class="tab" data-filter="completed">completed</button>
        <button class="tab" data-filter="history">history</button>
      </div>

      <div class="stats" id="statsBar">
        <span class="stats-count" id="statsCount">0 tasks</span>
        <button class="stats-clear" id="clearCompletedBtn">
          clear completed
        </button>
      </div>

      <div class="tasks-container" id="tasksContainer"></div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
      <div class="modal-card">
        <h3>edit task</h3>
        <input type="text" id="editInput" placeholder="Update your task..." />
        <div class="modal-buttons">
          <button class="modal-btn modal-btn-cancel" id="closeModalBtn">
            cancel
          </button>
          <button class="modal-btn modal-btn-save" id="saveEditBtn">
            save
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
